<!DOCTYPE html>
<html>
<head>
    <title>Edit Data</title>
</head>
<body>

<h1>Edit Data</h1>

<form method="POST">
    {% csrf_token %}

    <label>Name:</label>
    <input type="text" name="name" value="{{ data.name }}">

    <br><br>

    <label>Age:</label>
    <input type="number" name="age" value="{{ data.age }}">

    <br><br>

    <label>Place:</label>
    <input type="text" name="place" value="{{ data.place }}">

    <br><br>

    <button type="submit">Update</button>

</form>

<br>

<a href="{% url 'display' %}">
    <button type="button">Back</button>
</a>

</body>
</html>
