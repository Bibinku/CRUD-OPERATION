<h2>Data List</h2>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Place</th>
        <th>Edit</th>

    </tr>

    {% for i in data %}
    <tr>
        <td>{{ i.name }}</td>
        <td>{{ i.age }}</td>
        <td>{{ i.place }}</td>
        <td>
            <a href="{% url 'editdisplay' Nameid=i.id %}">
    <button type="button">Edit</button>
</a>
        </td>



    </tr>
    {% endfor %}
</table>
